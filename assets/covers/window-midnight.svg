    <linearGradient id="window-midnight-gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dfc891"/><stop offset=".42" stop-color="#c5a25e"/><stop offset=".72" stop-color="#536879"/><stop offset="1" stop-color="#c5a25e"/></linearGradient>
    <linearGradient id="window-midnight-paper" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#dfc891"/><stop offset="1" stop-color="#c5a25e"/></linearGradient>
    <radialGradient id="window-midnight-glow"><stop stop-color="#dfc891" stop-opacity=".5"/><stop offset=".32" stop-color="#c5a25e" stop-opacity=".22"/><stop offset="1" stop-color="#c5a25e" stop-opacity="0"/></radialGradient>
    <pattern id="window-midnight-grain" width="17" height="15" patternUnits="userSpaceOnUse"><path d="M0 3h17M5 0v15M0 13 17 2" fill="none" stroke="#dfc891" stroke-opacity=".032" stroke-width=".7"/></pattern>
    <filter id="window-midnight-shadow" x="-30%" y="-30%" width="170%" height="175%"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#060a0d" flood-opacity=".72"/></filter>
  </defs>
