<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300" role="img" aria-labelledby="window-midnight-title window-midnight-desc">
  <title id="window-midnight-title">夜窗 · 午夜蓝</title>
  <desc id="window-midnight-desc">从旧窗望向月夜城市与远处灯火，使用午夜蓝深色暖纸配色。</desc>

  <defs>
